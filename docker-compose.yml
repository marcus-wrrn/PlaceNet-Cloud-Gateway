# PlaceNet broker stack — Mosquitto (Dynamic Security) only.
#
# Deployment model (see OPERATIONS.md): the gateway runs as a NATIVE binary on
# the host under systemd; only the broker runs in Docker. systemd drives this
# compose file via the placenet-broker.service unit.
#
# Secrets come from /opt/placenet/.env (auto-loaded by docker compose):
#   DYNSEC_ADMIN_USER / DYNSEC_ADMIN_PASSWORD  (broker admin; shared with the gateway)
#
# Ports published to the host:
#   8883           MQTTS  — PUBLIC. Hamlets connect here (the broker's whole point).
#   127.0.0.1:1883 plain  — LOOPBACK ONLY. The native host gateway's dynsec admin
#                           channel; never exposed to the open internet.

services:
  broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    entrypoint: ["/docker-entrypoint-custom.sh"]
    environment:
      DYNSEC_ADMIN_USER: ${DYNSEC_ADMIN_USER:-gateway-admin}
      DYNSEC_ADMIN_PASSWORD: ${DYNSEC_ADMIN_PASSWORD:?set DYNSEC_ADMIN_PASSWORD}
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/entrypoint.sh:/docker-entrypoint-custom.sh:ro
      - ./certs/broker:/mosquitto/certs:ro      # server.crt + server.key (Let's Encrypt / your CA)
      - broker-data:/mosquitto/data             # dynsec state — MUST persist
    ports:
      - "8883:8883"             # public MQTTS for Hamlets
      - "127.0.0.1:1883:1883"   # dynsec admin, reachable only from the host gateway
    networks: [placenet]

volumes:
  broker-data:

networks:
  placenet:
