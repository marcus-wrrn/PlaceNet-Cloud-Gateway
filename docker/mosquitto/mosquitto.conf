# PlaceNet gateway broker — Dynamic Security + per-device isolation.
#
# Two listeners:
#   1883  plain  — INTERNAL ONLY (gateway dynsec admin). Never published to host.
#   8883  MQTTS  — public; Hamlets connect here with per-device username/password.
#
# Authentication is enforced globally by the dynamic-security plugin. With no
# matching ACL the default is DENY, so each device only reaches its own topics.

per_listener_settings false
allow_anonymous false

# dynsec state — lives on a persistent volume so devices survive restarts.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Internal plaintext listener for the gateway's dynsec admin connection.
listener 1883

# Public MQTTS listener. cert/key options bind to this (the most recent) listener.
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
